name: Docker Image CI Production

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

jobs:

  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ku-tech:smoke-${{ github.sha }}
          build-args: |
            NEXT_PUBLIC_CT_SITE_KEY=${{ secrets.NEXT_PUBLIC_CT_SITE_KEY }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GRAPHQL_URL=${{ secrets.NEXT_PUBLIC_GRAPHQL_URL }}

      - name: Verify HTTP 200
        shell: bash
        env:
          IMAGE_TAG: ku-tech:smoke-${{ github.sha }}
        run: |
          set -euo pipefail
          docker run -d --name ku-tech-ci-smoke \
            -p 127.0.0.1:3100:3000 "$IMAGE_TAG"
          trap 'docker logs --tail 50 ku-tech-ci-smoke || true; docker rm -f ku-tech-ci-smoke >/dev/null 2>&1 || true' EXIT
          for _ in {1..30}; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 http://127.0.0.1:3100/ || true)"
            if [[ "$code" == "200" ]]; then
              echo "Smoke test passed: HTTP 200"
              exit 0
            fi
            sleep 2
          done
          echo "::error::Smoke test failed"
          exit 1

  build:
    needs: smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.build_image.outputs.digest }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check Docker Hub credentials
        shell: bash
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$DOCKER_USERNAME" || -z "$DOCKER_PASSWORD" ]]; then
            echo "::error::Docker Hub credentials are missing"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push commit-tagged image
        id: build_image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/ku-tech:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          build-args: |
            NEXT_PUBLIC_CT_SITE_KEY=${{ secrets.NEXT_PUBLIC_CT_SITE_KEY }}
            NEXT_PUBLIC_RECAPTCHA_SITE_KEY=${{ secrets.NEXT_PUBLIC_RECAPTCHA_SITE_KEY }}
            NEXT_PUBLIC_GA_MEASUREMENT_ID=${{ secrets.NEXT_PUBLIC_GA_MEASUREMENT_ID }}
            NEXT_PUBLIC_GRAPHQL_URL=${{ secrets.NEXT_PUBLIC_GRAPHQL_URL }}

      - name: Record published image digest
        shell: bash
        env:
          IMAGE_REPO: ${{ secrets.DOCKER_USERNAME }}/ku-tech
          IMAGE_DIGEST: ${{ steps.build_image.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::Missing or invalid registry digest"
            exit 1
          fi
          {
            echo "### Docker image published (NOT deployed)"
            echo "- Commit: \`$COMMIT_SHA\`"
            echo "- Tag: \`$IMAGE_REPO:sha-$COMMIT_SHA\`"
            echo "- Pull reference: \`$IMAGE_REPO@$IMAGE_DIGEST\`"
            echo "- Production deployment: disabled until the receiver and verification process are audited"
          } >> "$GITHUB_STEP_SUMMARY"

  approve:
    name: Approve published image (no deployment)
    if: github.repository == 'ku-t3ch/ku-tech' && github.ref == 'refs/heads/main'
    needs: [smoke, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    environment:
      name: production
      deployment: false

    steps:
      - name: Create approved image receipt
        shell: bash
        env:
          IMAGE_DIGEST: ${{ needs.build.outputs.digest }}
          SOURCE_SHA: ${{ github.sha }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          digest = os.environ["IMAGE_DIGEST"]
          sha = os.environ["SOURCE_SHA"]
          run_id = int(os.environ["RUN_ID"])
          attempt = int(os.environ["RUN_ATTEMPT"])

          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("Invalid image digest")

          if not re.fullmatch(r"[0-9a-f]{40}", sha):
              raise SystemExit("Invalid commit SHA")

          receipt = {
              "schema_version": 1,
              "repository": "ku-t3ch/ku-tech",
              "workflow_id": 62618038,
              "run_id": run_id,
              "run_attempt": attempt,
              "commit": sha,
              "image": f"docker.io/kutech/ku-tech@{digest}",
              "digest": digest,
              "environment": "production"
          }

          Path("approved-image.json").write_text(
              json.dumps(receipt, indent=2) + "\n"
          )

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("## Production Image Approval\n\n")
              f.write(f"- Run: `{run_id}` (attempt {attempt})\n")
              f.write(f"- Commit: `{sha}`\n")
              f.write(f"- Image: `{receipt['image']}`\n")
              f.write("- Deployment: **NOT performed**\n")

          print("Approved image receipt created; no deployment performed.")
          PY

      - name: Upload approval receipt
        uses: actions/upload-artifact@v4
        with:
          name: production-approved-${{ github.run_id }}-${{ github.run_attempt }}
          path: approved-image.json
          if-no-files-found: error
          retention-days: 30
